name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install --yes lua5.1

      - name: Check Lua syntax and TOC files
        run: sh scripts/check.sh

      # Builds the package the way a release would, without uploading anything.
      - name: Preflight package
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1 (WoW Forever support)
        with:
          args: -d

      - name: Validate package contents
        shell: bash
        run: |
          shopt -s nullglob
          archives=(.release/*.zip)
          if (( ${#archives[@]} != 1 )); then
            printf 'expected exactly one package, found %d\n' "${#archives[@]}" >&2
            exit 1
          fi
          sh scripts/validate-package.sh "${archives[0]}"
